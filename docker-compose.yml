version: '3.8'

services:
  # Packbee API Server
  packbee:
    build: .
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=production
      - PORT=3011
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-http://localhost:3011/auth/github/callback}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - QDRANT_URL=http://qdrant:6333
      - STORAGE_DIR=/app/storage
    volumes:
      - packbee-data:/app/data
      - packbee-storage:/app/storage
    depends_on:
      - qdrant
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

volumes:
  packbee-data:
  packbee-storage:
  qdrant-data:
