name: pusher-realtime
version: 1.0.0
description: Zero-dependency server-side Pusher API client for triggering realtime events and querying channel state.
github: pusher/pusher-js
stars: 2214
category: realtime
tags:
  - pusher
  - realtime
  - websockets
  - events
  - api
env:
  - name: PUSHER_APP_ID
    description: Pusher application ID
    required: true
  - name: PUSHER_KEY
    description: Pusher application key
    required: true
  - name: PUSHER_SECRET
    description: Pusher application secret for HMAC signing
    required: true
  - name: PUSHER_CLUSTER
    description: Pusher cluster (e.g. us2, eu, ap1)
    required: true
exports:
  - triggerEvent
  - triggerBatch
  - getChannelInfo
  - getPresenceUsers
