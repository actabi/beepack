name: cloudflare-kv
version: 1.0.0
displayName: Cloudflare KV Store
description: Read, write, delete, and list keys in Cloudflare Workers KV via the REST API with TTL, metadata, and bulk operation support
keywords:
  - cloudflare
  - workers
  - kv
  - edge
  - cache
  - key-value
capabilities:
  - kv-get
  - kv-put
  - kv-delete
  - kv-list
  - kv-bulk-write
  - kv-bulk-delete
  - kv-get-with-metadata
requires:
  env:
    - CLOUDFLARE_ACCOUNT_ID
    - CLOUDFLARE_API_TOKEN
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
