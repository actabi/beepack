name: sentry-setup
version: 1.0.0
displayName: Sentry Setup for Next.js App Router
description: Config generators for Sentry error monitoring in Next.js App Router — client, server, and edge runtimes, source map upload, user context enrichment, custom event capture with structured metadata, performance tracing, and React error boundary source generation
keywords:
  - sentry
  - error-monitoring
  - next.js
  - app-router
  - source-maps
  - performance-tracing
  - error-boundary
  - observability
capabilities:
  - generate-sentry-client-config
  - generate-sentry-server-config
  - generate-sentry-edge-config
  - generate-next-config-with-sentry
  - enrich-user-context
  - capture-custom-event
  - instrument-api-route
  - generate-error-boundary-source
requires:
  env:
    - SENTRY_DSN
    - SENTRY_AUTH_TOKEN
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
