name: deepgram-speech
version: 1.0.0
description: Zero-dependency wrapper for Deepgram speech-to-text API — transcribe audio from URLs or buffers, list models, and check usage.
github: deepgram/deepgram-js-sdk
github_stars: 256
category: ai
tags:
  - speech-to-text
  - transcription
  - deepgram
  - audio
  - ai
env:
  - name: DEEPGRAM_API_KEY
    required: true
    description: Deepgram API key for authentication
exports:
  - transcribeUrl
  - transcribeBuffer
  - listModels
  - getUsage
