name: twilio-sms
version: 1.0.0
displayName: Twilio SMS & WhatsApp Client
description: Send SMS and WhatsApp messages via Twilio, with OTP verification, delivery webhooks, opt-out compliance, and webhook signature validation
keywords:
  - twilio
  - sms
  - whatsapp
  - otp
  - verify
  - messaging
  - notifications
  - compliance
capabilities:
  - send-sms
  - send-whatsapp
  - otp-send
  - otp-verify
  - delivery-webhook
  - opt-out-compliance
  - webhook-signature-verification
requires:
  env:
    - TWILIO_ACCOUNT_SID
    - TWILIO_AUTH_TOKEN
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
