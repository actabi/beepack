name: google-sheets-api
version: 1.0.0
displayName: Google Sheets API
description: Read, write, and manage Google Sheets spreadsheets using the Sheets API v4
keywords:
  - google-sheets
  - spreadsheet
  - api
  - data
  - google-workspace
capabilities:
  - read-sheets
  - write-cells
  - create-spreadsheets
  - batch-update
requires:
  env:
    - GOOGLE_SERVICE_ACCOUNT_KEY
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
source:
  url: https://github.com/googleapis/google-api-nodejs-client