name: trigger-dev
version: 1.0.0
displayName: Trigger.dev
description: Build and deploy fully-managed AI agents and background workflows. Modern alternative to traditional job queues.
keywords:
  - background-jobs
  - workflows
  - serverless
  - scheduling
  - ai-agents
  - triggers
capabilities:
  - background-jobs
  - scheduled-tasks
  - webhook-triggers
  - workflow-orchestration
