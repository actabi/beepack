name: algolia-search
version: 1.0.0
displayName: Algolia Search Client
description: Index settings management, record sync (save/batch/delete), full-text search with filters and facets, and query suggestions for the Algolia REST API. Zero dependencies.
keywords:
  - algolia
  - search
  - full-text-search
  - facets
  - indexing
  - query-suggestions
  - records
capabilities:
  - index-settings-get
  - index-settings-update
  - record-save
  - record-batch
  - record-delete
  - search
  - search-filters
  - search-facets
  - query-suggestions
requires:
  env:
    - ALGOLIA_APP_ID
    - ALGOLIA_API_KEY
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
