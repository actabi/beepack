name: supabase-client
version: 1.0.0
displayName: Supabase Client
description: CRUD with RLS-aware patterns, real-time subscriptions, auth helpers, and storage uploads for Supabase. Zero dependencies.
keywords:
  - supabase
  - database
  - postgres
  - realtime
  - auth
  - storage
  - rls
  - row-level-security
capabilities:
  - crud-with-rls
  - realtime-subscriptions
  - auth-signin-signout
  - session-management
  - token-refresh
  - storage-upload
  - presigned-urls
requires:
  env:
    - SUPABASE_URL
    - SUPABASE_ANON_KEY
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
