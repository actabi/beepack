name: jose
version: 1.0.0
displayName: jose — JWT/JWK/JWS/JWE
description: JWA, JWS, JWE, JWT, JWK, JWKS for Node.js, Browser, Cloudflare Workers, Deno, and Bun. The reference JWT library for JavaScript runtimes.
keywords:
  - jwt
  - jws
  - jwe
  - jwk
  - jwks
  - jose
  - token
  - crypto
capabilities:
  - jwt-sign
  - jwt-verify
  - jws-sign
  - jws-verify
  - jwe-encrypt
  - jwe-decrypt
  - jwk-generate
  - jwks-fetch
requires:
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
repository: https://github.com/panva/jose
stars: 7487
license: MIT
