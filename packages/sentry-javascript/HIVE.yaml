name: sentry-javascript
version: 1.0.0
displayName: Sentry JavaScript SDK
description: Official Sentry SDKs for JavaScript. Error tracking and performance monitoring for Next.js, React, and Node.js.
keywords:
  - sentry
  - error-tracking
  - monitoring
  - performance
  - crash-reporting
  - apm
capabilities:
  - error-capture
  - performance-tracing
  - breadcrumbs
  - user-feedback
  - release-tracking
  - source-maps
requires:
  env:
    - SENTRY_DSN
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
repository: https://github.com/getsentry/sentry-javascript
stars: 8623
license: MIT
