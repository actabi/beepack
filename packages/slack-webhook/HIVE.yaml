name: slack-webhook
version: 1.0.0
displayName: Slack Webhook and Web API
description: Send Slack messages via webhooks and Web API with blocks, threads, and file uploads
keywords:
  - slack
  - webhook
  - notifications
  - chat
  - blocks
  - messaging
capabilities:
  - send-webhook-message
  - send-channel-message
  - send-thread-reply
  - upload-file
  - build-block-kit-messages
requires:
  env:
    - SLACK_WEBHOOK_URL
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
