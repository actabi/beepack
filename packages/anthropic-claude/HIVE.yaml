name: anthropic-claude
version: 1.0.0
displayName: Anthropic Claude Client
description: Call Claude models with streaming, tool use, extended thinking, vision, prompt caching, and batch processing. Zero dependencies.
keywords:
  - anthropic
  - claude
  - llm
  - ai
  - streaming
  - tool-use
  - function-calling
  - vision
  - prompt-caching
  - batch
capabilities:
  - streaming-messages
  - tool-use
  - extended-thinking
  - vision
  - prompt-caching
  - batch-api
requires:
  env:
    - ANTHROPIC_API_KEY
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
