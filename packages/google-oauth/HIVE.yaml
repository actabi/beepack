name: google-oauth
version: 1.0.0
displayName: Google OAuth 2.0 Flow
description: Complete Google OAuth 2.0 flow with PKCE, ID token verification, refresh token rotation, scope management, and user profile fetching via Google People API
keywords:
  - google
  - oauth
  - authentication
  - login
  - social-auth
  - pkce
  - oidc
capabilities:
  - generate-auth-url-with-pkce
  - exchange-code-for-token
  - verify-id-token
  - refresh-access-token
  - get-user-profile
  - manage-scopes
requires:
  env:
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
