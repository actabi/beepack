name: mongodb-rest-client
version: 1.0.0
description: Zero-dependency wrapper for MongoDB Atlas Data API (REST)
github: mongodb/node-mongodb-native
stars: 10181
category: database
tags:
  - mongodb
  - atlas
  - database
  - rest-api
  - nosql
env:
  - name: MONGODB_DATA_API_KEY
    description: MongoDB Atlas Data API key
    required: true
  - name: MONGODB_DATA_API_URL
    description: MongoDB Atlas Data API base URL
    required: true
  - name: MONGODB_CLUSTER
    description: MongoDB Atlas cluster name
    required: true
  - name: MONGODB_DATABASE
    description: Default database name
    required: true
exports:
  - findOne
  - find
  - insertOne
  - insertMany
  - updateOne
  - deleteOne
