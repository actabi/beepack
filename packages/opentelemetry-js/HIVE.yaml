name: opentelemetry-js
version: 1.0.0
displayName: OpenTelemetry JavaScript
description: OpenTelemetry JavaScript Client. CNCF standard for traces, metrics, and logs. Vendor-neutral, compatible with Jaeger, Grafana, and Datadog.
keywords:
  - opentelemetry
  - otel
  - tracing
  - metrics
  - logs
  - observability
  - cncf
capabilities:
  - distributed-tracing
  - metrics-collection
  - log-export
  - span-creation
  - context-propagation
  - auto-instrumentation
requires:
  env:
    - OTEL_EXPORTER_OTLP_ENDPOINT
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
repository: https://github.com/open-telemetry/opentelemetry-js
stars: 3349
license: Apache-2.0
