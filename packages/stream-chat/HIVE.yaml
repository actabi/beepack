name: stream-chat
version: 1.0.0
displayName: Stream Chat API
description: Server-side wrapper for Stream Chat - create channels, send messages, manage users, and generate tokens
keywords: [stream, chat, messaging, realtime, channels, users]
capabilities: [create-channel, send-message, query-users, generate-token, get-channel]
requires:
  env:
    - STREAM_API_KEY
    - STREAM_API_SECRET
  deps:
    - node >= 18
compatible: [cursor, copilot, claude, windsurf]
language: javascript
module: esm
dependencies: none
