name: upstash-redis
version: 1.0.0
displayName: Upstash Redis Client
description: Upstash Redis REST API client with cache-aside, session storage, distributed rate limiting, pub/sub, queue, and pipeline support. Zero dependencies, uses native fetch.
keywords:
  - redis
  - upstash
  - cache
  - session
  - rate-limit
  - pubsub
  - queue
  - pipeline
  - kv
  - serverless
capabilities:
  - cache-aside
  - session-storage-sliding-expiry
  - distributed-rate-limiting
  - pubsub
  - queue-lpush-brpop
  - pipeline-batch
requires:
  env:
    - UPSTASH_REDIS_REST_URL
    - UPSTASH_REDIS_REST_TOKEN
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
