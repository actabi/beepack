name: langchainjs
version: 1.0.0
displayName: LangChain.js
description: The agent engineering platform for JavaScript/TypeScript. Build complex LLM apps with chains, agents, RAG, and vector stores.
keywords:
  - langchain
  - llm
  - agents
  - rag
  - chains
  - vector-stores
  - ai
capabilities:
  - chain-composition
  - agent-creation
  - rag-pipeline
  - vector-store-integration
  - tool-usage
  - memory-management
requires:
  env:
    - OPENAI_API_KEY
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
repository: https://github.com/langchain-ai/langchainjs
stars: 17450
license: MIT
