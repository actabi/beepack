name: csv-export
version: 1.0.0
displayName: CSV / Excel Export & Import
description: Generate CSV and TSV files from data arrays with streaming support, parse and validate CSV imports, and convert to Excel-compatible format
keywords:
  - csv
  - tsv
  - export
  - import
  - excel
  - streaming
  - data-export
  - parsing
capabilities:
  - generate-csv
  - generate-tsv
  - stream-csv
  - parse-csv
  - validate-csv
  - detect-delimiter
requires:
  env: []
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
