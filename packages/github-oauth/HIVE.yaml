name: github-oauth
version: 1.0.0
displayName: GitHub OAuth Flow
description: Complete GitHub OAuth 2.0 flow with PKCE, token refresh, and user profile fetching
keywords:
  - github
  - oauth
  - authentication
  - login
  - social-auth
capabilities:
  - generate-auth-url
  - exchange-code-for-token
  - refresh-access-token
  - get-user-profile
  - get-user-emails
requires:
  env:
    - GITHUB_CLIENT_ID
    - GITHUB_CLIENT_SECRET
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
