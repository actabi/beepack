name: webhook-validator
version: 1.0.0
displayName: Webhook Validator
description: Signature verification for Stripe, GitHub, Slack, Linear, Shopify, and Vercel webhooks. Timing-safe HMAC comparison, replay attack prevention, raw body preservation middleware, and provider auto-detection. Zero dependencies.
keywords:
  - webhook
  - hmac
  - signature
  - stripe
  - github
  - slack
  - linear
  - shopify
  - vercel
  - security
capabilities:
  - stripe-webhook-verification
  - github-webhook-verification
  - slack-webhook-verification
  - linear-webhook-verification
  - shopify-webhook-verification
  - vercel-webhook-verification
  - timing-safe-comparison
  - replay-attack-prevention
  - provider-auto-detection
  - raw-body-middleware
requires:
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
