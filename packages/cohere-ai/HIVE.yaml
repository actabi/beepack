name: cohere-ai
version: 1.0.0
description: Zero-dependency wrapper for Cohere AI API — generate, embed, classify, rerank, and chat
author: beepack
license: MIT
category: ai
tags:
  - cohere
  - ai
  - nlp
  - embeddings
  - text-generation
  - classification
  - reranking
  - chat
sourceUrl: https://github.com/cohere-ai/cohere-typescript
env:
  - name: COHERE_API_KEY
    required: true
    description: Cohere API key from https://dashboard.cohere.com/api-keys
exports:
  - name: generate
    description: Generate text completions using Cohere models
  - name: embed
    description: Generate text embeddings for semantic search
  - name: classify
    description: Classify text inputs with labeled examples
  - name: rerank
    description: Rerank documents by relevance to a query
  - name: chat
    description: Send a chat message with optional conversation history
