name: aws-sdk-js-v3
version: 1.0.0
displayName: AWS SDK v3 (S3 Client)
description: Modularized AWS SDK for JavaScript. The @aws-sdk/client-s3 module is the standard for S3-compatible storage (AWS, MinIO, R2, etc.).
keywords:
  - aws
  - s3
  - storage
  - cloud
  - upload
  - download
  - minio
  - r2
capabilities:
  - s3-upload
  - s3-download
  - s3-list
  - s3-delete
  - presigned-urls
  - multipart-upload
requires:
  env:
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_REGION
    - S3_BUCKET
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
repository: https://github.com/aws/aws-sdk-js-v3
stars: 3604
license: Apache-2.0
