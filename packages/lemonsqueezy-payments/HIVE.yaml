name: lemonsqueezy-payments
version: 1.0.0
displayName: LemonSqueezy Payments
description: Checkout, webhooks, subscription management, and customer portal via the LemonSqueezy API. Zero dependencies.
keywords:
  - lemonsqueezy
  - payments
  - subscriptions
  - checkout
  - billing
  - saas
capabilities:
  - create-checkout
  - validate-webhook
  - route-webhook-event
  - get-subscription
  - update-subscription
  - cancel-subscription
  - customer-portal
  - change-plan
requires:
  env:
    - LEMONSQUEEZY_API_KEY
    - LEMONSQUEEZY_STORE_ID
    - LEMONSQUEEZY_WEBHOOK_SECRET
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
