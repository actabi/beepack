name: passport-auth
version: 1.0.0
displayName: Passport.js Auth Strategies
description: Password hashing, JWT creation/verification, and OAuth2 flows with zero dependencies
keywords:
  - passport
  - authentication
  - oauth2
  - jwt
  - session
  - login
capabilities:
  - local-auth
  - jwt-validation
  - oauth2-flow
  - password-hashing
requires:
  env:
    - JWT_SECRET
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
source:
  url: https://github.com/jaredhanson/passport
  repo: jaredhanson/passport
  stars: 23523
  license: MIT