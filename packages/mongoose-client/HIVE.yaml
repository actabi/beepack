name: mongoose-client
version: 1.0.0
displayName: MongoDB REST Client
description: Query and manage MongoDB collections via the Atlas Data API with a Mongoose-inspired interface
keywords:
  - mongodb
  - mongoose
  - atlas
  - database
  - nosql
capabilities:
  - find-documents
  - insert-documents
  - update-documents
  - aggregate
requires:
  env:
    - MONGODB_DATA_API_URL
    - MONGODB_DATA_API_KEY
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
source:
  url: https://github.com/Automattic/mongoose
  repo: Automattic/mongoose
  stars: 27469
  license: MIT