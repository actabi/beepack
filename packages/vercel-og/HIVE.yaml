name: vercel-og
version: 1.0.0
displayName: Vercel OG Image Generator
description: Source code generators for Next.js OG image route handlers, card templates, font loading config, dynamic composition helpers, and cache header utilities. Zero dependencies.
keywords:
  - og
  - open-graph
  - vercel
  - next.js
  - image-generation
  - seo
  - social-card
  - meta-tags
capabilities:
  - og-route-handler-generator
  - card-template-generator
  - font-loading-config
  - dynamic-composition-helpers
  - og-meta-tag-builder
  - cache-header-helpers
requires:
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
