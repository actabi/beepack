name: next-auth
version: 1.0.0
displayName: NextAuth.js (Auth.js)
description: Authentication for the Web. Supports OAuth, Magic Links, Credentials, and session management for Next.js applications.
keywords:
  - auth
  - oauth
  - nextjs
  - session
  - authentication
  - login
  - jwt
capabilities:
  - oauth-providers
  - session-management
  - jwt-tokens
  - magic-links
  - credentials-auth
requires:
  env:
    - NEXTAUTH_SECRET
    - NEXTAUTH_URL
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
repository: https://github.com/nextauthjs/next-auth
stars: 28172
license: ISC
