name: better-auth
version: 1.0.0
displayName: Better Auth
description: The most comprehensive authentication framework for TypeScript. Framework-agnostic, supports email/password, OAuth, 2FA, organizations.
keywords:
  - auth
  - typescript
  - oauth
  - 2fa
  - organizations
  - authentication
capabilities:
  - email-password-auth
  - oauth-providers
  - two-factor-auth
  - organization-management
  - session-management
requires:
  env:
    - BETTER_AUTH_SECRET
    - BETTER_AUTH_URL
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
repository: https://github.com/better-auth/better-auth
stars: 27698
license: MIT
