name: email-templates
version: 1.0.0
displayName: Email Templates
description: Create, preview, and send custom email templates for Node.js. Supports multiple template engines and preview in browser.
keywords:
  - email
  - templates
  - preview
  - nodemailer
  - transactional
capabilities:
  - render-templates
  - preview-emails
  - send-emails
  - multiple-engines
  - i18n-support
requires:
  env:
    - SMTP_HOST
    - SMTP_PORT
    - SMTP_USER
    - SMTP_PASS
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
repository: https://github.com/forwardemail/email-templates
stars: 3728
license: MIT
