name: openai-assistants
version: 1.0.0
displayName: OpenAI Assistants API
description: Create and manage OpenAI Assistants, threads, messages, and runs with streaming support, file uploads, and tool call handling
keywords:
  - openai
  - assistants
  - threads
  - runs
  - tool-use
  - streaming
  - file-search
capabilities:
  - create-assistant
  - create-thread
  - add-message
  - create-run
  - stream-run
  - poll-run
  - list-messages
  - upload-file
  - delete-file
requires:
  env:
    - OPENAI_API_KEY
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
