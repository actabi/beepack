name: planetscale-db
version: 1.0.0
description: Zero-dependency wrapper for PlanetScale serverless database driver (HTTP API)
github: planetscale/database-js
stars: 1194
category: database
tags:
  - planetscale
  - mysql
  - serverless
  - database
  - sql
env:
  - name: DATABASE_HOST
    description: PlanetScale database host (e.g. aws.connect.psdb.cloud)
    required: true
  - name: DATABASE_USERNAME
    description: PlanetScale database username
    required: true
  - name: DATABASE_PASSWORD
    description: PlanetScale database password
    required: true
exports:
  - execute
  - transaction
  - createConnection
