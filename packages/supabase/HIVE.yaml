name: supabase
version: 1.0.0
displayName: Supabase
description: The Postgres development platform. Complete backend-as-a-service with auth, database, storage, realtime, and edge functions.
keywords:
  - supabase
  - postgres
  - baas
  - auth
  - storage
  - realtime
  - edge-functions
capabilities:
  - database-queries
  - auth-management
  - file-storage
  - realtime-subscriptions
  - edge-functions
  - rpc-calls
requires:
  env:
    - SUPABASE_URL
    - SUPABASE_ANON_KEY
  deps:
    - node >= 18
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: none
repository: https://github.com/supabase/supabase
stars: 100518
license: Apache-2.0
