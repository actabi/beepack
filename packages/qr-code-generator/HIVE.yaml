name: qr-code-generator
version: 1.0.0
displayName: QR Code Generator
description: Generate QR codes as SVG strings or data URIs for URLs, WiFi credentials, vCards, and payment links. Pure JavaScript, no dependencies.
keywords:
  - qr-code
  - qr
  - svg
  - barcode
  - wifi
  - vcard
  - payment
capabilities:
  - url-qr
  - wifi-qr
  - vcard-qr
  - svg-output
  - data-uri-output
  - sepa-qr
requires:
  env: []
  deps:
    - node >= 18
    - qrcode >= 1.5.0
compatible:
  - cursor
  - copilot
  - claude
  - openclaw
  - windsurf
language: javascript
module: esm
dependencies: qrcode@1.5.x
