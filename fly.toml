# Fly.io configuration for Packbee
# Deploy: fly launch / fly deploy

app = "packbee"
primary_region = "cdg"  # Paris

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3011"
  NODE_ENV = "production"

[http_service]
  internal_port = 3011
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "packbee_data"
  destination = "/app/data"
