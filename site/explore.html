<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Packages — Beepack</title>
    <meta name="description" content="Browse and search all Beepack packages. Find battle-tested API integrations for OAuth, payments, storage, webhooks and more.">
    <meta name="keywords" content="explore API packages, browse integrations, search code packages, OAuth, Stripe, webhooks, vibecoding">
    <link rel="canonical" href="https://beepack.ai/explore.html">
    <meta property="og:title" content="Explore Packages — Beepack">
    <meta property="og:description" content="Browse and search all battle-tested API integrations. OAuth, payments, storage, webhooks and more.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://beepack.ai/explore.html">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .explore-page { padding: 48px 0 80px; min-height: 70vh; }
        .explore-header { text-align: center; margin-bottom: 32px; }
        .explore-header h1 { font-size: 2.5rem; margin-bottom: 8px; }
        .explore-header p { color: var(--text-muted); }

        .explore-search {
            display: flex;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto 16px;
        }
        .explore-search input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .explore-search input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }

        .explore-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 32px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .sort-select {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 13px;
            font-family: inherit;
            background: white;
            cursor: pointer;
        }

        .explore-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .explore-card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            transition: box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .explore-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .explore-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .explore-card .card-icon { font-size: 32px; }
        .explore-card .card-stats {
            display: flex;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .explore-card h4 { margin-bottom: 8px; }
        .explore-card h4 a {
            color: inherit;
            text-decoration: none;
        }
        .explore-card h4 a:hover { color: var(--primary-dark); }

        .explore-card .card-desc {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .explore-card .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .explore-card .card-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .explore-card .card-footer {
            margin-top: auto;
        }

        .loading-state, .empty-state {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
        }
        .loading-state p, .empty-state p { font-size: 1.1rem; }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 48px;
        }
        .pagination button {
            padding: 8px 20px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: white;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pagination button:hover:not(:disabled) {
            background: var(--background-alt);
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination .page-info {
            font-size: 14px;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .explore-header h1 { font-size: 2rem; }
            .explore-search { flex-direction: column; }
            .explore-controls { flex-direction: column; gap: 12px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                <img src="/img/logo.png" alt="Beepack" class="logo-img" style="height:36px;vertical-align:middle;">
                <span class="logo-text">Beepack</span>
            </a>
            <nav class="nav">
                <a href="/">Home</a>
                <a href="/explore.html" style="color:var(--text);">Explore</a>
                <a href="docs/">Docs</a>
                <a href="api-docs/">API</a>
            </nav>
            <div class="header-actions">
                <a href="#login" class="btn btn-outline">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    Sign in with GitHub
                </a>
            </div>
        </div>
    </header>

    <main class="explore-page">
        <div class="container">
            <div class="explore-header">
                <h1>Explore Packages</h1>
                <p>Browse all battle-tested integrations, ready to pull into your project.</p>
            </div>

            <div class="explore-search">
                <input type="text" id="explore-query" placeholder="Search packages... (e.g., 'OAuth', 'email', 'database')" autofocus>
                <button class="btn btn-primary" onclick="doSearch()">Search</button>
            </div>

            <div class="explore-controls">
                <span id="result-count"></span>
                <label>
                    Sort by:
                    <select class="sort-select" id="sort-select" onchange="loadPackages()">
                        <option value="downloads">Most downloaded</option>
                        <option value="name">Name (A-Z)</option>
                        <option value="updated">Recently updated</option>
                    </select>
                </label>
            </div>

            <div id="packages-container">
                <div class="loading-state"><p>Loading packages...</p></div>
            </div>

            <div class="pagination" id="pagination" style="display:none;">
                <button id="prev-btn" onclick="changePage(-1)">Previous</button>
                <span class="page-info" id="page-info"></span>
                <button id="next-btn" onclick="changePage(1)">Next</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <img src="/img/logo.png" alt="Beepack" class="logo-img" style="height:28px;vertical-align:middle;">
                    <span class="logo-text">Beepack</span>
                </div>
                <p>Open source. Made with love for vibe coders.</p>
            </div>
            <div class="footer-links">
                <a href="docs/">Documentation</a>
                <a href="api-docs/">API</a>
                <a href="docs/faq.html">FAQ</a>
            </div>
        </div>
    </footer>

    <script>
        const ICON_MAP = {
            'notion': '📝', 'stripe': '💳', 'payment': '💳', 'openai': '🤖',
            'ai': '🤖', 'github': '🐙', 'supabase': '⚡', 'database': '🗄️',
            'auth': '🔐', 'email': '📧', 'api': '🔌', 'sms': '📱',
            'telegram': '📱', 'discord': '🎮', 'slack': '💬', 'webhook': '🔗',
            'pdf': '🧾', 'image': '🖼️', 'storage': '☁️', 'cache': '🔴',
            'redis': '🔴', 'postgres': '🐘', 'search': '🔍', 'analytics': '📊',
            'sentry': '🚨', 'security': '🛡️', 'rate-limit': '⏱️'
        };

        let currentPage = 1;
        let totalPages = 1;
        let searchMode = false;
        let searchTimer = null;
        const LIMIT = 24;

        function getIcon(keywords) {
            if (!keywords) return '📦';
            for (const kw of keywords) {
                const key = kw.toLowerCase();
                if (ICON_MAP[key]) return ICON_MAP[key];
                for (const [k, v] of Object.entries(ICON_MAP)) {
                    if (key.includes(k)) return v;
                }
            }
            return '📦';
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return num.toString();
        }

        function renderCard(pkg) {
            const keywords = pkg.keywords || [];
            const icon = getIcon(keywords);
            const scanned = pkg.security === 'clean';
            return `
                <div class="explore-card">
                    <div class="card-header">
                        <span class="card-icon">${icon}</span>
                        <div class="card-stats">
                            <span>👍 ${pkg.stats ? pkg.stats.likes : 0}</span>
                            <span>👎 ${pkg.stats ? pkg.stats.dislikes : 0}</span>
                            <span>📥 ${formatNumber(pkg.stats ? pkg.stats.downloads : 0)}</span>
                        </div>
                    </div>
                    <h4><a href="/package.html?slug=${pkg.slug}">${pkg.displayName || pkg.slug}</a></h4>
                    <p class="card-desc">${pkg.description || ''}</p>
                    <div class="card-meta">
                        <span>v${pkg.version || '1.0.0'}</span>
                        <span>by ${pkg.owner ? pkg.owner.handle : 'unknown'}</span>
                    </div>
                    <div class="card-tags">
                        ${scanned ? '<span class="tag" style="background:#d1fae5;color:#065f46">Scanned</span>' : ''}
                        ${keywords.slice(0, 3).map(k => `<span class="tag">${k}</span>`).join('')}
                    </div>
                    <div class="card-footer">
                        <a href="/package.html?slug=${pkg.slug}" class="btn btn-sm btn-outline">View details</a>
                    </div>
                </div>
            `;
        }

        async function loadPackages() {
            const container = document.getElementById('packages-container');
            const sort = document.getElementById('sort-select').value;

            container.innerHTML = '<div class="loading-state"><p>Loading packages...</p></div>';
            searchMode = false;

            try {
                const r = await fetch(`/api/v1/packages?page=${currentPage}&limit=${LIMIT}&sort=${sort}`);
                const data = await r.json();

                if (!data.packages || data.packages.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>No packages found.</p></div>';
                    document.getElementById('pagination').style.display = 'none';
                    document.getElementById('result-count').textContent = '0 packages';
                    return;
                }

                totalPages = Math.ceil(data.pagination.total / LIMIT);
                document.getElementById('result-count').textContent = `${data.pagination.total} packages`;

                container.innerHTML = '<div class="explore-grid">' +
                    data.packages.map(renderCard).join('') +
                    '</div>';

                updatePagination();
            } catch (e) {
                container.innerHTML = '<div class="empty-state"><p>Failed to load packages. API may be offline.</p></div>';
            }
        }

        async function doSearch() {
            const query = document.getElementById('explore-query').value.trim();
            if (!query) {
                currentPage = 1;
                loadPackages();
                return;
            }

            const container = document.getElementById('packages-container');
            container.innerHTML = '<div class="loading-state"><p>Searching...</p></div>';
            searchMode = true;

            try {
                const r = await fetch('/api/v1/search?q=' + encodeURIComponent(query));
                const data = await r.json();

                if (!data.results || data.results.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>No packages match your search.</p></div>';
                    document.getElementById('pagination').style.display = 'none';
                    document.getElementById('result-count').textContent = '0 results';
                    return;
                }

                document.getElementById('result-count').textContent = `${data.results.length} results`;
                document.getElementById('pagination').style.display = 'none';

                container.innerHTML = '<div class="explore-grid">' +
                    data.results.map(renderCard).join('') +
                    '</div>';
            } catch (e) {
                container.innerHTML = '<div class="empty-state"><p>Search failed. API may be offline.</p></div>';
            }
        }

        function updatePagination() {
            const pag = document.getElementById('pagination');
            if (searchMode || totalPages <= 1) {
                pag.style.display = 'none';
                return;
            }
            pag.style.display = 'flex';
            document.getElementById('prev-btn').disabled = currentPage <= 1;
            document.getElementById('next-btn').disabled = currentPage >= totalPages;
            document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
        }

        function changePage(delta) {
            currentPage += delta;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            loadPackages();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Real-time search with debounce
        document.getElementById('explore-query').addEventListener('input', function() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                if (this.value.trim()) {
                    doSearch();
                } else {
                    currentPage = 1;
                    loadPackages();
                }
            }, 300);
        });

        document.getElementById('explore-query').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                clearTimeout(searchTimer);
                doSearch();
            }
        });

        // GitHub OAuth login
        document.querySelectorAll('a[href="#login"]').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = '/auth/github';
            });
        });

        // Handle URL params
        const params = new URLSearchParams(location.search);
        if (params.get('q')) {
            document.getElementById('explore-query').value = params.get('q');
            doSearch();
        } else {
            loadPackages();
        }
    </script>
</body>
</html>
