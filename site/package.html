<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package - Beepack 🐝</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .package-page { padding: 48px 0; }
        .package-header-full { margin-bottom: 32px; }
        .package-title { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .package-title h1 { font-size: 2.5rem; margin: 0; }
        .package-title .version { background: var(--primary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 14px; }
        .package-stats-full { display: flex; gap: 24px; margin-bottom: 24px; }
        .package-stats-full .stat { display: flex; align-items: center; gap: 8px; }
        .package-description { font-size: 1.25rem; color: var(--text-muted); margin-bottom: 24px; }
        .package-actions { display: flex; gap: 12px; margin-bottom: 32px; }
        .package-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 32px; }
        .package-main { }
        .package-sidebar { }
        .sidebar-section { background: var(--background-alt); padding: 20px; border-radius: var(--radius); margin-bottom: 16px; }
        .sidebar-section h3 { font-size: 14px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
        .sidebar-section ul { list-style: none; }
        .sidebar-section li { padding: 4px 0; }
        .install-box { background: var(--secondary); color: white; padding: 16px; border-radius: var(--radius); margin-bottom: 24px; }
        .install-box code { font-family: monospace; }
        .readme-content { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; }
        .readme-content h2 { margin-top: 24px; }
        .readme-content pre { background: var(--secondary); color: #e5e7eb; padding: 16px; border-radius: var(--radius); overflow-x: auto; }
        .capability-tag { display: inline-block; background: #d1fae5; color: #065f46; padding: 4px 10px; border-radius: 4px; font-size: 12px; margin: 2px; }
        .compatible-tag { display: inline-block; background: #dbeafe; color: #1e40af; padding: 4px 10px; border-radius: 4px; font-size: 12px; margin: 2px; }
        @media (max-width: 900px) { .package-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                <img src="/img/logo.png" alt="Beepack" class="logo-img" style="height:36px;vertical-align:middle;">
                <span class="logo-text">Beepack</span>
            </a>
            <nav class="nav">
                <a href="/#packages">Packages</a>
                <a href="docs/">Docs</a>
                <a href="api-docs/">API</a>
            </nav>
        </div>
    </header>

    <main class="package-page">
        <div class="container">
            <div id="package-content">
                <p>Loading...</p>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = '/api/v1';
        
        async function loadPackage() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            
            if (!slug) {
                document.getElementById('package-content').innerHTML = '<p>Package not specified. <a href="/">Go back</a></p>';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/packages/${slug}`);
                if (!response.ok) throw new Error('Package not found');
                const pkg = await response.json();
                
                document.title = `${pkg.displayName} - Beepack 🐝`;
                
                document.getElementById('package-content').innerHTML = `
                    <div class="package-header-full">
                        <div class="package-title">
                            <h1>${pkg.displayName}</h1>
                            <span class="version">v${pkg.latestVersion}</span>
                        </div>
                        <p class="package-description">${pkg.description}</p>
                        <div class="package-stats-full">
                            <div class="stat">⭐ <strong>${pkg.stats.stars}</strong> stars</div>
                            <div class="stat">📥 <strong>${pkg.stats.downloads.toLocaleString()}</strong> downloads</div>
                            <div class="stat">📋 <strong>${pkg.stats.versions || 1}</strong> versions</div>
                        </div>
                    </div>
                    
                    <div class="install-box">
                        <code>beepack install ${pkg.slug}</code>
                    </div>
                    
                    <div class="package-grid">
                        <div class="package-main">
                            <div class="readme-content">
                                <h2>📖 README</h2>
                                <p>${pkg.description}</p>
                                
                                <h2>🚀 Installation</h2>
                                <pre><code>beepack install ${pkg.slug}</code></pre>
                                
                                <h2>✨ Capabilities</h2>
                                <p>${pkg.capabilities.map(c => `<span class="capability-tag">${c}</span>`).join(' ')}</p>
                                
                                <h2>⚙️ Requirements</h2>
                                <p>This package requires the following environment variables to be set.</p>
                                
                                <h2>📝 Usage</h2>
                                <pre><code>// Import the package
import ${pkg.slug.replace(/-/g, '_')} from 'beepack/${pkg.slug}';

// Use the API
// See documentation for details</code></pre>
                            </div>
                        </div>
                        
                        <div class="package-sidebar">
                            <div class="sidebar-section">
                                <h3>Author</h3>
                                <p>👤 ${pkg.owner.handle}</p>
                            </div>
                            
                            <div class="sidebar-section">
                                <h3>Keywords</h3>
                                <ul>
                                    ${pkg.keywords.map(k => `<li>🏷️ ${k}</li>`).join('')}
                                </ul>
                            </div>
                            
                            <div class="sidebar-section">
                                <h3>Compatible With</h3>
                                <p>${pkg.compatible.map(c => `<span class="compatible-tag">${c}</span>`).join(' ')}</p>
                            </div>
                            
                            <div class="sidebar-section">
                                <h3>Versions</h3>
                                <ul>
                                    ${pkg.versions.length > 0 
                                        ? pkg.versions.map(v => `<li>📦 ${v}</li>`).join('')
                                        : `<li>📦 ${pkg.latestVersion} (latest)</li>`
                                    }
                                </ul>
                            </div>
                            
                            <div class="sidebar-section">
                                <h3>Links</h3>
                                <ul>
                                    <li><a href="/api-docs/">📖 API Docs</a></li>
                                    <li><a href="/docs/hive-yaml.html">📝 HIVE.yaml Spec</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
            } catch (e) {
                document.getElementById('package-content').innerHTML = `
                    <h1>Package not found</h1>
                    <p>The package "${slug}" doesn't exist or the API is not available.</p>
                    <p><a href="/">← Back to home</a></p>
                `;
            }
        }
        
        loadPackage();
    </script>
</body>
</html>
