<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package - Beepack</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        .pkg-page { padding: 40px 0 80px; }
        .pkg-hero { margin-bottom: 32px; }
        .pkg-hero h1 { font-size: 2rem; margin: 0 0 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .pkg-hero .badge { background: var(--primary); color: #fff; font-size: 13px; padding: 3px 10px; border-radius: 12px; font-weight: 500; }
        .pkg-hero .desc { font-size: 1.1rem; color: var(--text-muted); margin: 0 0 16px; }
        .pkg-meta { display: flex; gap: 20px; font-size: 14px; color: var(--text-muted); flex-wrap: wrap; }
        .pkg-meta span { display: flex; align-items: center; gap: 4px; }
        .install-bar { background: #1e293b; color: #e2e8f0; padding: 14px 20px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 14px; margin-bottom: 32px; display: flex; align-items: center; justify-content: space-between; }
        .install-bar .cmd { opacity: 0.5; }
        .install-bar button { background: var(--primary); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .pkg-grid { display: grid; grid-template-columns: 1fr 280px; gap: 32px; }
        @media (max-width: 900px) { .pkg-grid { grid-template-columns: 1fr; } }
        .pkg-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 24px; }
        .pkg-tab { padding: 10px 20px; cursor: pointer; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
        .pkg-tab:hover { color: var(--text); }
        .pkg-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .readme-box { line-height: 1.7; }
        .readme-box h1 { font-size: 1.5rem; margin: 24px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .readme-box h2 { font-size: 1.25rem; margin: 28px 0 12px; }
        .readme-box h3 { font-size: 1.1rem; margin: 20px 0 8px; }
        .readme-box pre { background: #1e293b; color: #e2e8f0; padding: 16px; border-radius: 8px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5; }
        .readme-box code { font-family: 'JetBrains Mono', monospace; font-size: 0.9em; }
        .readme-box p code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
        .readme-box ul, .readme-box ol { padding-left: 24px; }
        .readme-box li { margin: 4px 0; }
        .readme-box table { border-collapse: collapse; width: 100%; margin: 16px 0; }
        .readme-box th, .readme-box td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        .readme-box th { background: #f8fafc; }
        .cap-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .cap-tag { display: inline-flex; align-items: center; gap: 6px; background: #ecfdf5; color: #065f46; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; }
        .cap-tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #10b981; }
        .req-list { list-style: none; padding: 0; }
        .req-list li { padding: 8px 12px; background: #f8fafc; border-radius: 6px; margin: 4px 0; font-size: 14px; }
        .req-list li code { background: #e2e8f0; padding: 2px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .req-none { color: #10b981; font-weight: 500; }
        .side-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .side-card h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin: 0 0 10px; }
        .side-card .author { display: flex; align-items: center; gap: 8px; font-weight: 500; }
        .side-card .author img { width: 24px; height: 24px; border-radius: 50%; }
        .kw-tag { display: inline-block; background: #f1f5f9; color: #475569; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin: 2px; }
        .compat-tag { display: inline-block; background: #dbeafe; color: #1e40af; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin: 2px; font-weight: 500; }
        .ver-tag { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .file-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .file-item { display: flex; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.2s; }
        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background: #f8fafc; }
        .file-item.active { background: #eff6ff; }
        .file-name { font-family: 'JetBrains Mono', monospace; font-size: 14px; }
        .file-size { color: var(--text-muted); font-size: 12px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                <img src="/img/logo.png" alt="Beepack" class="logo-img" style="height:36px;vertical-align:middle;">
                <span class="logo-text">Beepack</span>
            </a>
            <nav class="nav">
                <a href="/#packages">Packages</a>
                <a href="docs/">Docs</a>
                <a href="api-docs/">API</a>
            </nav>
        </div>
    </header>

    <main class="pkg-page">
        <div class="container" id="pkg-root">
            <p>Loading...</p>
        </div>
    </main>

    <script>
        function el(tag, attrs, children) {
            const e = document.createElement(tag);
            if (attrs) Object.entries(attrs).forEach(([k, v]) => {
                if (k === 'className') e.className = v;
                else if (k === 'innerHTML') e.innerHTML = v;
                else if (k === 'textContent') e.textContent = v;
                else if (k === 'onclick') e.onclick = v;
                else e.setAttribute(k, v);
            });
            if (children) children.forEach(c => { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
            return e;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadPackage() {
            const slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) { document.getElementById('pkg-root').innerHTML = '<p>Package not specified. <a href="/">Go back</a></p>'; return; }

            try {
                const res = await fetch('/api/v1/packages/' + slug);
                if (!res.ok) throw new Error();
                const pkg = await res.json();
                document.title = pkg.displayName + ' - Beepack';

                const root = document.getElementById('pkg-root');
                root.innerHTML = '';

                const req = pkg.requires || {};
                const hasEnv = req.env && req.env.length > 0;
                const hasDeps = req.deps && req.deps.length > 0;

                // Hero
                var hero = el('div', {className: 'pkg-hero'});
                var h1 = el('h1');
                h1.appendChild(document.createTextNode(pkg.displayName + ' '));
                h1.appendChild(el('span', {className: 'badge', textContent: 'v' + pkg.latestVersion}));
                if (pkg.security && pkg.security.verdict) {
                    var secColors = {clean: '#10b981', suspicious: '#f59e0b', malicious: '#ef4444'};
                    var secLabels = {clean: 'Scanned - Safe', suspicious: 'Review needed', malicious: 'Security risk'};
                    var secBadge = el('span', {
                        textContent: secLabels[pkg.security.verdict] || pkg.security.verdict,
                        style: 'font-size:12px;padding:3px 10px;border-radius:12px;font-weight:500;color:#fff;background:' + (secColors[pkg.security.verdict] || '#6b7280')
                    });
                    h1.appendChild(document.createTextNode(' '));
                    h1.appendChild(secBadge);
                }
                hero.appendChild(h1);
                hero.appendChild(el('p', {className: 'desc', textContent: pkg.description}));
                var meta = el('div', {className: 'pkg-meta'});
                meta.innerHTML = '<span>by <strong>' + escapeHtml(pkg.owner.handle) + '</strong></span>' +
                    '<span>&#128077; ' + pkg.stats.likes + ' likes</span>' +
                    '<span>&#128078; ' + pkg.stats.dislikes + ' dislikes</span>' +
                    '<span>&#8595; ' + pkg.stats.downloads.toLocaleString() + ' downloads</span>';
                hero.appendChild(meta);
                root.appendChild(hero);

                // Install bar
                var bar = el('div', {className: 'install-bar'});
                bar.innerHTML = '<span><span class="cmd">$</span> beepack pull ' + escapeHtml(pkg.slug) + '</span>';
                var copyBtn = el('button', {textContent: 'Copy', onclick: function() { navigator.clipboard.writeText('beepack pull ' + pkg.slug); }});
                bar.appendChild(copyBtn);
                root.appendChild(bar);

                // Grid
                var grid = el('div', {className: 'pkg-grid'});

                // Main column
                var main = el('div', {className: 'pkg-main'});

                // Tabs
                var tabs = el('div', {className: 'pkg-tabs'});
                var sugCount = (pkg.openSuggestions || []).length;
                var tabNames = [{id: 'readme', label: 'Documentation'}, {id: 'code', label: 'Code'}, {id: 'suggestions', label: 'Suggestions' + (sugCount > 0 ? ' (' + sugCount + ')' : '')}, {id: 'capabilities', label: 'Capabilities'}, {id: 'requirements', label: 'Requirements'}];
                tabNames.forEach(function(t, i) {
                    var tab = el('div', {className: 'pkg-tab' + (i === 0 ? ' active' : ''), 'data-tab': t.id, textContent: t.label});
                    tabs.appendChild(tab);
                });
                main.appendChild(tabs);

                // Tab: Readme
                var tabReadme = el('div', {className: 'tab-content active', id: 'tab-readme'});
                var readmeBox = el('div', {className: 'readme-box'});
                var readmeClean = (pkg.readme || 'No documentation available.').replace(/^#\s+.+\n/, '');
                readmeBox.innerHTML = marked.parse(readmeClean);
                tabReadme.appendChild(readmeBox);
                main.appendChild(tabReadme);

                // Tab: Code
                var tabCode = el('div', {className: 'tab-content', id: 'tab-code'});
                tabCode.innerHTML = '<div id="code-viewer">Click to load source files...</div>';
                main.appendChild(tabCode);

                // Tab: Suggestions
                var tabSug = el('div', {className: 'tab-content', id: 'tab-suggestions'});
                var suggestions = pkg.openSuggestions || [];
                if (suggestions.length === 0) {
                    tabSug.appendChild(el('p', {textContent: 'No suggestions yet. AI assistants can suggest improvements to this package.', style: 'color:var(--text-muted)'}));
                } else {
                    suggestions.forEach(function(s) {
                        var card = el('div', {style: 'border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px'});
                        card.appendChild(el('h3', {textContent: s.title, style: 'margin:0 0 8px;font-size:1rem'}));
                        card.appendChild(el('p', {textContent: s.description, style: 'margin:0 0 8px;color:var(--text-muted);font-size:14px'}));
                        card.appendChild(el('span', {textContent: 'by ' + s.author + ' - ' + new Date(s.createdAt).toLocaleDateString(), style: 'font-size:12px;color:var(--text-muted)'}));
                        tabSug.appendChild(card);
                    });
                }
                main.appendChild(tabSug);

                // Tab: Capabilities
                var tabCap = el('div', {className: 'tab-content', id: 'tab-capabilities'});
                var capGrid = el('div', {className: 'cap-grid'});
                (pkg.capabilities || []).forEach(function(c) {
                    capGrid.appendChild(el('span', {className: 'cap-tag', textContent: c.replace(/_/g, ' ')}));
                });
                tabCap.appendChild(capGrid);
                main.appendChild(tabCap);

                // Tab: Requirements
                var tabReq = el('div', {className: 'tab-content', id: 'tab-requirements'});
                if (hasEnv) {
                    tabReq.appendChild(el('h3', {textContent: 'Environment Variables'}));
                    var ul = el('ul', {className: 'req-list'});
                    req.env.forEach(function(e) { ul.appendChild(el('li', {innerHTML: '<code>' + escapeHtml(e) + '</code>'})); });
                    tabReq.appendChild(ul);
                }
                if (hasDeps) {
                    tabReq.appendChild(el('h3', {textContent: 'Dependencies'}));
                    var ul2 = el('ul', {className: 'req-list'});
                    req.deps.forEach(function(d) { ul2.appendChild(el('li', {textContent: d})); });
                    tabReq.appendChild(ul2);
                }
                if (!hasEnv && !hasDeps) {
                    tabReq.appendChild(el('p', {className: 'req-none', innerHTML: '&#10003; No requirements - works out of the box.'}));
                }
                main.appendChild(tabReq);

                grid.appendChild(main);

                // Sidebar
                var sidebar = el('div', {className: 'pkg-sidebar'});

                // Author
                var cardAuthor = el('div', {className: 'side-card'});
                cardAuthor.appendChild(el('h4', {textContent: 'Author'}));
                var authorDiv = el('div', {className: 'author'});
                authorDiv.appendChild(el('img', {src: pkg.owner.avatarUrl, alt: pkg.owner.handle}));
                authorDiv.appendChild(document.createTextNode(pkg.owner.handle));
                cardAuthor.appendChild(authorDiv);
                sidebar.appendChild(cardAuthor);

                // Compatible
                var cardCompat = el('div', {className: 'side-card'});
                cardCompat.appendChild(el('h4', {textContent: 'Compatible with'}));
                var compatDiv = el('div');
                (pkg.compatible || []).forEach(function(c) {
                    compatDiv.appendChild(el('span', {className: 'compat-tag', textContent: c}));
                    compatDiv.appendChild(document.createTextNode(' '));
                });
                cardCompat.appendChild(compatDiv);
                sidebar.appendChild(cardCompat);

                // Version
                var cardVer = el('div', {className: 'side-card'});
                cardVer.appendChild(el('h4', {textContent: 'Version'}));
                cardVer.appendChild(el('span', {className: 'ver-tag', textContent: pkg.latestVersion}));
                sidebar.appendChild(cardVer);

                // Keywords
                var cardKw = el('div', {className: 'side-card'});
                cardKw.appendChild(el('h4', {textContent: 'Keywords'}));
                var kwDiv = el('div');
                (pkg.keywords || []).forEach(function(k) {
                    kwDiv.appendChild(el('span', {className: 'kw-tag', textContent: k}));
                    kwDiv.appendChild(document.createTextNode(' '));
                });
                cardKw.appendChild(kwDiv);
                sidebar.appendChild(cardKw);

                // Bundles
                if (pkg.bundles && pkg.bundles.length > 0) {
                    var cardBundles = el('div', {className: 'side-card'});
                    cardBundles.appendChild(el('h4', {textContent: 'Bundles'}));
                    pkg.bundles.forEach(function(b) {
                        var a = el('a', {href: '/bundle.html?slug=' + b.slug, style: 'display:block;padding:6px 0;font-size:14px;text-decoration:none;color:var(--primary);font-weight:500'});
                        a.textContent = b.displayName || b.slug;
                        cardBundles.appendChild(a);
                        if (b.description) {
                            cardBundles.appendChild(el('p', {textContent: b.description, style: 'font-size:12px;color:var(--text-muted);margin:0 0 8px'}));
                        }
                    });
                    sidebar.appendChild(cardBundles);
                }

                grid.appendChild(sidebar);
                root.appendChild(grid);

                // Tab switching
                document.querySelectorAll('.pkg-tab').forEach(function(tab) {
                    tab.addEventListener('click', function() {
                        document.querySelectorAll('.pkg-tab').forEach(function(t) { t.classList.remove('active'); });
                        document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
                        tab.classList.add('active');
                        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');

                        if (tab.dataset.tab === 'code' && !window.codeLoaded) {
                            loadCode(pkg.slug);
                        }
                    });
                });

            } catch (e) {
                document.getElementById('pkg-root').innerHTML = '<h1>Package not found</h1><p>The package does not exist or the API is not available.</p><p><a href="/">Back to home</a></p>';
            }
        }

        async function loadCode(slug) {
            try {
                var res = await fetch('/api/v1/packages/' + slug + '/files');
                if (!res.ok) throw new Error();
                var data = await res.json();

                var container = document.getElementById('code-viewer');
                container.innerHTML = '';

                var list = el('div', {className: 'file-list'});
                data.files.forEach(function(file) {
                    var item = el('div', {className: 'file-item', 'data-path': file.path});
                    item.appendChild(el('span', {className: 'file-name', textContent: file.path}));
                    item.appendChild(el('span', {className: 'file-size', textContent: (file.size / 1024).toFixed(1) + ' KB'}));
                    item.addEventListener('click', async function() {
                        var content = await fetch('/api/v1/packages/' + slug + '/files/' + file.path).then(function(r) { return r.text(); });
                        var viewer = document.getElementById('file-content');
                        viewer.innerHTML = '';
                        viewer.appendChild(el('h3', {textContent: file.path}));
                        var pre = el('pre');
                        var code = el('code', {textContent: content});
                        pre.appendChild(code);
                        viewer.appendChild(pre);
                        document.querySelectorAll('.file-item').forEach(function(i) { i.classList.remove('active'); });
                        item.classList.add('active');
                    });
                    list.appendChild(item);
                });
                container.appendChild(list);
                container.appendChild(el('div', {id: 'file-content', className: 'readme-box', style: 'margin-top:20px'}));
                window.codeLoaded = true;
            } catch (e) {
                document.getElementById('code-viewer').innerHTML = '<p>Source files require authentication. <a href="/auth/github">Login</a> to view code.</p>';
            }
        }

        loadPackage();
    </script>
</body>
</html>
