<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bundle - Beepack</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        .bundle-page { padding: 40px 0 80px; }
        .bundle-hero { margin-bottom: 32px; text-align: center; }
        .bundle-hero h1 { font-size: 2.2rem; margin: 0 0 12px; }
        .bundle-hero .desc { font-size: 1.15rem; color: var(--text-muted); margin: 0 0 8px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .bundle-hero .use-case { background: #fffbeb; border: 1px solid #fbbf24; border-radius: 8px; padding: 16px 24px; margin: 24px auto 0; max-width: 600px; text-align: left; line-height: 1.6; }
        .bundle-hero .use-case strong { color: #92400e; }
        .bundle-hero .meta { font-size: 14px; color: var(--text-muted); margin-top: 12px; }
        .install-all { background: #1e293b; color: #e2e8f0; padding: 16px 24px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 14px; margin: 24px auto; max-width: 500px; display: flex; align-items: center; justify-content: space-between; }
        .install-all .cmd { opacity: 0.5; }
        .install-all button { background: var(--primary); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .pkg-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
        .pkg-card { border: 1px solid var(--border); border-radius: 12px; padding: 24px; transition: box-shadow 0.2s; }
        .pkg-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .pkg-card h3 { margin: 0 0 8px; font-size: 1.1rem; }
        .pkg-card h3 a { color: inherit; text-decoration: none; }
        .pkg-card h3 a:hover { color: var(--primary); }
        .pkg-card .role { display: inline-block; background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .pkg-card .desc { color: var(--text-muted); font-size: 14px; margin: 0 0 12px; line-height: 1.5; }
        .pkg-card .caps { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
        .pkg-card .cap { background: #ecfdf5; color: #065f46; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
        .pkg-card .stats { font-size: 13px; color: var(--text-muted); }
        .pkg-card .ver { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }
        .section-title { font-size: 1.3rem; margin: 40px 0 20px; text-align: center; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                <img src="/img/logo.png" alt="Beepack" class="logo-img" style="height:36px;vertical-align:middle;">
                <span class="logo-text">Beepack</span>
            </a>
            <nav class="nav">
                <a href="/#packages">Packages</a>
                <a href="/search.html">Search</a>
                <a href="docs/">Docs</a>
            </nav>
        </div>
    </header>

    <main class="bundle-page">
        <div class="container" id="bundle-root">
            <p>Loading...</p>
        </div>
    </main>

    <script>
        function esc(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadBundle() {
            var slug = new URLSearchParams(window.location.search).get('slug');
            if (!slug) { document.getElementById('bundle-root').innerHTML = '<p>Bundle not specified. <a href="/">Go back</a></p>'; return; }

            try {
                var res = await fetch('/api/v1/bundles/' + slug);
                if (!res.ok) throw new Error();
                var bundle = await res.json();
                document.title = bundle.displayName + ' - Beepack Bundle';

                var root = document.getElementById('bundle-root');
                root.innerHTML = '';

                // Hero
                var hero = document.createElement('div');
                hero.className = 'bundle-hero';
                hero.innerHTML = '<h1>' + esc(bundle.displayName) + '</h1>' +
                    '<p class="desc">' + esc(bundle.description) + '</p>' +
                    (bundle.useCase ? '<div class="use-case"><strong>Use case:</strong> ' + esc(bundle.useCase) + '</div>' : '') +
                    '<p class="meta">' + bundle.packages.length + ' packages - by ' + esc(bundle.owner) + '</p>';
                root.appendChild(hero);

                // Install all
                var installCmd = bundle.packages.map(function(p) { return 'beepack install ' + p.slug; }).join(' && ');
                var bar = document.createElement('div');
                bar.className = 'install-all';
                bar.innerHTML = '<span><span class="cmd">$</span> ' + esc(installCmd) + '</span>';
                var btn = document.createElement('button');
                btn.textContent = 'Copy';
                btn.onclick = function() { navigator.clipboard.writeText(installCmd); };
                bar.appendChild(btn);
                root.appendChild(bar);

                // Package cards
                var title = document.createElement('h2');
                title.className = 'section-title';
                title.textContent = 'Packages in this bundle';
                root.appendChild(title);

                var grid = document.createElement('div');
                grid.className = 'pkg-cards';

                bundle.packages.forEach(function(p) {
                    var card = document.createElement('div');
                    card.className = 'pkg-card';

                    var html = '';
                    if (p.role) html += '<span class="role">' + esc(p.role) + '</span>';
                    html += '<h3><a href="/package.html?slug=' + esc(p.slug) + '">' + esc(p.displayName) + '</a></h3>';
                    html += '<p class="desc">' + esc(p.description) + '</p>';
                    if (p.capabilities && p.capabilities.length > 0) {
                        html += '<div class="caps">' + p.capabilities.slice(0, 4).map(function(c) { return '<span class="cap">' + esc(c) + '</span>'; }).join('') + '</div>';
                    }
                    html += '<div class="stats">';
                    html += '<span class="ver">v' + esc(p.version) + '</span>';
                    html += ' - ' + p.stats.stars + ' stars, ' + p.stats.downloads + ' downloads';
                    html += '</div>';

                    card.innerHTML = html;
                    grid.appendChild(card);
                });

                root.appendChild(grid);
            } catch (e) {
                document.getElementById('bundle-root').innerHTML = '<h1>Bundle not found</h1><p><a href="/">Back to home</a></p>';
            }
        }

        loadBundle();
    </script>
</body>
</html>
