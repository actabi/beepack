# Render.com Blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: packbee
    env: node
    region: frankfurt  # EU
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3011
      - key: GITHUB_CLIENT_ID
        sync: false  # Set manually
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: packbee-data
      mountPath: /app/data
      sizeGB: 1
